# Índice plano de standards/. Se lee completo (es pequeño) — los documentos
# individuales se abren sólo bajo demanda. Valida contra schemas/standards-index.schema.json.

stack-tecnologico:
  resumen: "Cómo se usa el stack oficial Klap (Java 21, Spring Boot 4.x, Gradle, Angular 21+, PostgreSQL 16, Kafka, AWS Lambda). Las versiones viven en config/klap.yaml, no aquí."
  path: standards/stack/tecnologico.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [stack, java, spring-boot, angular, postgresql, kafka, aws]

arquitectura-capas-clean-architecture:
  resumen: "Arquitectura por capas + Clean Architecture + SOLID para microservicios Spring Boot: estructura de paquetes, dirección de dependencias, puertos/adaptadores, cuándo aplicar DDD."
  path: standards/arquitectura/capas-y-clean-architecture.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [arquitectura, clean-architecture, solid, ddd, spring-boot]

clean-code-solid:
  resumen: "Clean Code y SOLID como reglas concretas con ejemplos mal/bien: naming, tamaño de método/clase, errores explícitos, inmutabilidad, inyección de dependencias."
  path: standards/desarrollo/clean-code-solid.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [clean-code, solid, desarrollo]

testing-estrategia-coverage:
  resumen: "Pirámide de testing, TDD, JaCoCo, umbral de coverage (ver config/quality-gates.yaml) y por qué no optimizar cobertura ciegamente."
  path: standards/testing/estrategia-y-coverage.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [testing, tdd, coverage, jacoco]

seguridad-owasp-secretos:
  resumen: "Controles OWASP Top 10 aplicables y gestión de secretos (Secrets Manager/Spring Cloud Config), masking de PAN obligatorio en logs (últimos 4 dígitos; PII general se asume ya tratada)."
  path: standards/seguridad/owasp-y-secretos.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [seguridad, owasp, secretos, pii, pan]

datos-postgresql:
  resumen: "Indexación, EXPLAIN ANALYZE, cero N+1, límites de @Transactional (incl. readOnly), acceso a datos (JdbcTemplate por default), naming de esquema/tabla y manejo de migraciones."
  path: standards/datos/postgresql.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [postgresql, datos, performance]

api-diseno:
  resumen: "Diseño REST (versionado, códigos de estado, paginación), idempotencia con persistencia real, formato de error estándar (code/message/date/time), compatibilidad hacia atrás obligatoria para REST y Kafka, OpenAPI como contrato fuente de verdad."
  path: standards/api/diseno-apis.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [api, rest, openapi, compatibilidad]

git-cicd-flujo-pipeline:
  resumen: "Convenciones de branch/commit, cuándo se requiere PR review, gates de CI (tests, coverage, Sonar, deps-scan) y portabilidad del pipeline."
  path: standards/git-cicd/flujo-y-pipeline.md
  obligatoriedad: MANDATORY
  estado: vigente
  tags: [git, ci-cd, pipeline]

documentacion-adr-memoria:
  resumen: "Cuándo escribir un ADR (incl. cuándo reemplazar uno previo, nunca editarlo), relación entre memoria del repo (component.yaml/docs/context) y documentación de producto en Confluence."
  path: standards/documentacion/adr-y-memoria.md
  obligatoriedad: RECOMMENDED
  estado: vigente
  tags: [documentacion, adr, memoria]

stack-angular-typescript:
  resumen: "Klap fija sólo el piso de versión de Angular (config/klap.yaml); patrones idiomáticos vigentes se consultan en vivo vía Context7, no en una guía estática que caduca con cada release."
  path: standards/stack/angular-typescript.md
  obligatoriedad: RECOMMENDED
  estado: vigente
  tags: [angular, typescript, frontend, context7]

infraestructura-aws-serverless:
  resumen: "[Esqueleto, requiere revisión] Prácticas AWS Lambda/Serverless en Klap — no hay contenido confirmado aún, pendiente de completar por el equipo."
  path: standards/infraestructura/aws-serverless.md
  obligatoriedad: CONTEXT_DEPENDENT
  estado: requiere-revision
  tags: [aws, lambda, serverless]

observabilidad-logging-metricas-trazas:
  resumen: "Niveles de logging (DEBUG/INFO/WARN/ERROR) confirmados; métricas y trazas pendientes de definir por el equipo (backend, qué se traza distribuidamente)."
  path: standards/observabilidad/logging-metricas-trazas.md
  obligatoriedad: RECOMMENDED
  estado: vigente
  tags: [observabilidad, logging, metricas, trazas]

arquitectura-ddd-avanzado:
