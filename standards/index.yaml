  path: standards/arquitectura/ddd-avanzado.md
  obligatoriedad: CONTEXT_DEPENDENT
  estado: requiere-revision
  tags: [ddd, arquitectura]

desarrollo-convenciones-naming-javadoc-lombok:
  resumen: "Naming de clases/DTOs/excepciones (RECOMMENDED), JavaDoc obligatorio en API pública para autogeneración de docs (MANDATORY, reconciliado con clean-code-solid.md), y qué anotaciones Lombok usar/evitar según inmutabilidad."
