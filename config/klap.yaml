# Configuración central del Klap Dev-Kit.
# Única fuente de verdad para versiones de stack, nombres de MCP y rutas de índices.
# No hardcodear ninguno de estos valores en skills, agents o standards — referenciar este archivo.

version: 1

mcp:
  # Nombre del servidor MCP tal como está registrado en la sesión de Claude Code.
  # Cambiar aquí cuando el servicio real de Klap Knowledge reemplace al mock.
  knowledge:
    server: klap-knowledge
    modo: produccion # mock | produccion
    fallback_si_no_disponible: true
    # El servicio real vive en un repo aparte (klap-dev-kit-knowledge); el plugin no puede saber
    # dónde lo clonó cada quien. KLAP_KNOWLEDGE_HOME es la única variable: el intérprete se
    # deriva de ella en scripts/klap-knowledge-launch.mjs (<HOME>/.venv/{Scripts|bin}/python
    # según plataforma, con fallback al `python` del PATH). No hay KLAP_KNOWLEDGE_PYTHON.
    requiere_env: [KLAP_KNOWLEDGE_HOME]
    obtener_credencial: docs/installation.md # no es una credencial: es el checkout del repo
    # Comando para levantar el mock como proceso stdio independiente de Claude Code
    # (usado por scripts/targeted-sync.mjs y por tests). No aplica en modo produccion.
    mock_launch: ["node", "mocks/klap-knowledge-mcp/server.mjs"]
  atlassian:
    # Servidor declarado por el propio plugin en .mcp.json — llega con la instalación, igual
    # para todo el equipo. `server` es el segmento que Claude Code usa al nombrar sus tools
    # (mcp__<server>__<tool>). No confundir con el conector personal `claude_ai_Atlassian`,
    # que apunta al endpoint v1 y no expone Bitbucket (ver docs/atlassian-mcp.md).
    server: plugin_klap_atlassian
    endpoint: https://mcp.atlassian.com/v2/mcp
    # Cada dev autentica con su propia cuenta corporativa vía /mcp. El kit nunca almacena
    # credenciales ni admite un token compartido — por eso `auth` sólo acepta `oauth`.
    auth: oauth
    productos: [jira, confluence, bitbucket] # verificados read-write el 2026-09-10
  sonarqube:
    # SonarQube Cloud. Única conexión del kit que no puede usar OAuth: el MCP oficial de
    # SonarSource sólo admite token de usuario. El token vive en una variable de entorno de cada
    # dev — nunca en el repo — y `scripts/verificar-conexiones.mjs` avisa si falta.
    server: plugin_klap_sonarqube
    endpoint: https://api.sonarcloud.io/mcp
    auth: token
    org: multicaja-cloud
    requiere_env: [KLAP_SONARQUBE_TOKEN]
    obtener_credencial: https://sonarcloud.io/account/access-tokens
    # El análisis lo produce Jenkins al correr el pipeline del repo (desa o qa); el kit sólo lee
    # métricas ya publicadas. Un proyecto sin análisis reciente no devuelve métricas aunque el
    # token sea válido — ver docs/conexiones.md.
    project_key:
      # La project key NO es descubrible desde el repo. Verificado en
      # CUOTA-COMERCIO/ms-central-sva-consultas-cuota-comercio e
      # IMPULSO-KLAP/ms-central-fasf-r2-reportes: sólo hay build.gradle, sin bloque `sonar`, sin
      # sonar-project.properties, sin .sonarlint/connectedMode.json y sin Jenkinsfile. Vive en la
      # configuración de Jenkins, fuera del alcance de lectura del kit.
      #
      # Por eso se RESUELVE, nunca se construye por concatenación: una key errónea devuelve
      # métricas de otro proyecto **en silencio** — mismo shape, valores plausibles — y el
      # veredicto de certificación queda firmado con datos ajenos. Ver agents/certificador.md.
      resolver_con: search_my_sonarqube_projects
      ambiente_por_defecto: desa
      ambientes: [desa, qa, test, preprod, prod]
      # Los prefijos y sufijos de abajo son OBSERVADOS en la organización (76 proyectos al
      # 2026-09-10), no un formato garantizado: sirven para reconocer y elegir entre candidatos,
      # nunca para armar una key. Cinco proyectos no llevan prefijo de ambiente en absoluto
      # (`ms-pci-smv-*`, `srv-pci-smv-*`, `datalake-*`, `mcs-central-be-envia-fe-sii`).
      # REQUIERE-USUARIO: confirmar qué designa cada prefijo de tipo — se infiere del patrón,
      # no está documentado en ninguna parte legible desde los repos.
      prefijos_tipo: [mcs, mcf, lbd, ms, pci, ret, cnsr]
      # Sufijos que la key arrastra y el nombre del repo no tiene. Un mismo repo puede tener
      # varias keys que difieren SÓLO en el sufijo (p.ej. la marca de tarjeta:
      # `...presenta-cc-clearing-jdk17-visa`), así que el sufijo no es ruido descartable.
      sufijos_observados: ["-jdk17", "-2", "-3", "-4", "-bk", "-visa"]
      # Productos sin proyecto en SonarCloud: una HU de estos repos no puede ejercer el gate de
      # Sonar y el bloque se omite con advertencia, no se reprueba.
      sin_proyecto: [abono-ya] # 0 resultados para "anticipo" entre los 76 proyectos
  context7:
    # Documentación oficial de librerías/frameworks en vivo — nunca hardcodear guías estáticas de
    # contenido que caduca con cada release. Endpoint público: sin credencial ni configuración.
    server: plugin_klap_context7
    endpoint: https://mcp.context7.com/mcp
    auth: ninguna

stack_soportado:
  # origen: C:\klap-workspace\CLAUDE.md (2026-08-26). Confirmar con el equipo antes de v1.0.0.
  backend:
    java: "21"
    spring_boot: "4.x"
    spring_cloud_config: "4.x"
    gradle: "8.x"
  frontend:
    angular: "21.x" # piso — cualquier proyecto puede estar en una versión mayor, nunca menor
    typescript: "5.x"
    rxjs: "7.x"
    scss: "1.x" # Dart Sass
  datos:
    postgresql: "16"
  mensajeria:
    confluent_kafka: "7.x"
  infraestructura:
    aws_lambda: true
  ci:
    proveedor: github-actions # portable a Bitbucket/Jenkins si el hosting migra

memoria:
  # Checkout local del repo de memoria (klap-dev-kit-knowledge), usado por
  # scripts/memoria-git.mjs para dejar cada patch aplicado en una rama producto/<id> con PR
  # hacia main. Ruta relativa a la raíz de este repo — asume el layout hermano de klap-workspace.
  repo_path: ../klap-dev-kit-knowledge
  # Raíz del workspace que contiene la carpeta de cada producto (p.ej. <workspace_root>/abono-ya/
  # con un subdirectorio por repo). Usada por scripts/descubrir-componentes.mjs para el escaneo
  # local de repos — determinista, sin red, sin LLM. Ruta relativa a la raíz de este repo.
  workspace_root: ..

rutas:
  standards_index: standards/index.yaml
  quality_gates: config/quality-gates.yaml
  context_index_schema: schemas/context-index.schema.json
  knowledge_mcp_contract: schemas/knowledge-mcp/tools.json

hosting:
  # Son dos hostings coexistentes, no una migración pendiente: este kit vive en GitHub y los
  # repos de producto Klap viven en Bitbucket Cloud. La versión anterior de este bloque decía
  # `proveedor_actual: github` + `migracion_planificada: bitbucket`, lo que hacía leer Bitbucket
  # como futuro cuando ya es el presente de todos los repos de producto.
  # Informativo: nada del kit lo consume programáticamente. El CI debe mantenerse portable.
  dev_kit:
    proveedor: github
    cuenta: alexis.apablaza@klap.cl
    migracion_planificada: bitbucket # intención declarada para este repo, sin fecha
  productos:
    proveedor: bitbucket
    workspace: multicaja-cloud # verificado 2026-09-10 (remotos git + listBitbucketRepositories)

contratos:
  # Versión de schemas/knowledge-mcp/tools.json contra la que este kit fue validado.
  # Un mismatch con el contractVersion del schema falla npm run validate — es la señal
  # explícita de "el contrato avanzó, revisa antes de asumir compatibilidad" en vez de
  # una ruptura silenciosa cuando Etapa 3 reemplace el mock por el servicio real.
  knowledge_mcp: "2.4.0"
