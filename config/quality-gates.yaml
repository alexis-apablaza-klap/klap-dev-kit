# Umbrales de certificación. Fuente única — scripts/quality-gate.mjs lee este archivo,
# nunca hardcodear umbrales en agents/skills.

version: 1

coverage:
  minimo_porcentaje: 92
  herramienta: jacoco # ajustar por stack (jacoco para Java, istanbul/nyc para TS)
  no_optimizar_ciegamente: true # priorizar calidad de pruebas sobre el número; ver standards/testing

sonarqube:
  quality_gate_debe_pasar: true
  bloquear_si:
    - bugs_nuevos > 0
    - vulnerabilities_nuevas > 0
    - security_hotspots_sin_revisar > 0
    - rating_mantenibilidad_peor_que: "A"

dependencias:
  herramientas: [owasp-dependency-check, trivy]
  bloquear_severidad_minima: HIGH # CRITICAL y HIGH bloquean; MEDIUM/LOW quedan reportados, no bloquean
  permitir_excepcion_explicita: true # requiere justificación registrada, ver standards/seguridad

secretos:
  bloquear_siempre: true # cualquier hallazgo bloquea el commit, sin excepción

tests:
  bloquear_si_falla_alguno: true
  tipos_esperados: [unit, integration, functional]
