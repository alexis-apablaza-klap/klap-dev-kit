name: CI

on:
  pull_request:
  push:
    branches: [main]

# Toda la lógica de validación vive en scripts Node (scripts/*.mjs, tests/), no en este
# YAML. Migrar de GitHub Actions a otro proveedor (p.ej. Bitbucket Pipelines) es cambiar
# este archivo por su equivalente sin reescribir ninguna validación.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Tests (schemas, scripts, plugin, mock MCP)
        run: npm test

      - name: Coherencia estructural del plugin
        run: npm run validate
